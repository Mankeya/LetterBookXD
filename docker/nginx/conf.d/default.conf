# Main site configuration
# This file is included from nginx.conf

# Rate limiting zones (defined in nginx.conf)
# limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
# limit_req_zone $binary_remote_addr zone=proxy:10m rate=120r/m;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost letterbookxd.com app.letterbookxd.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Rate limiting
    limit_req zone=global burst=500 nodelay;
    limit_conn conn_limit 10;

    # Security: block common attacks
    if ($request_uri ~* "(\.git|\.env|\.sql|wp-admin|wp-login|\.php$)") {
        return 404;
    }

    # Block suspicious user agents
    if ($http_user_agent ~* "(sqlmap|nikto|nmap|hydra|dirb|gobuster|w3af|acunetix|nessus|openvas)") {
        return 403;
    }

    # Frontend
    location / {
        limit_req zone=global burst=500 nodelay;
        proxy_pass http://web;
        include proxy_params;
    }

    # API Gateway with endpoint-specific rate limits
    location /api/ {
        # Auth endpoints - strict rate limit
        location ~* ^/api/auth/(login|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Token refresh - moderate rate limit
        location ~* ^/api/auth/refresh {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Search endpoints
        location ~* ^/api/search {
            limit_req zone=search burst=10 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Manga image proxy
        location ~* ^/api/manga/proxy {
            limit_req zone=proxy burst=20 nodelay;
            proxy_pass http://api;
            include proxy_params;
            
            # Additional proxy settings for images
            proxy_buffering off;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$host$request_uri";
        }

        # Reading list mutations
        location ~* ^/api/reading-list {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Social endpoints (follow, feed)
        location ~* ^/api/(users|feed|follow) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Books/Manga details (read-heavy, cacheable)
        location ~* ^/api/(books|manga)/[^/]+$ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api;
            include proxy_params;
            
            # Cache GET requests
            proxy_cache_valid 200 5m;
            proxy_cache_key "$scheme$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Chapters list
        location ~* ^/api/manga/[^/]+/chapters {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api;
            include proxy_params;
            
            proxy_cache_valid 200 10m;
            proxy_cache_key "$scheme$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Chapter images (via proxy)
        location ~* ^/api/manga/chapters/[^/]+/images {
            limit_req zone=proxy burst=100 nodelay;
            proxy_pass http://api;
            include proxy_params;
            
            proxy_buffering off;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$scheme$host$request_uri";
        }

        # Health checks - no rate limit for monitoring
        location ~* ^/api/health {
            limit_req zone=global burst=100 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Swagger docs
        location ~* ^/api/docs {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }

        # Default API catch-all
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api;
            include proxy_params;
        }
    }

    # Health checks (no rate limit for monitoring)
    location /health {
        proxy_pass http://api/health;
        include proxy_params;
    }

    # Static assets with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @web;
    }

    location @web {
        proxy_pass http://web;
        include proxy_params;
    }

    # Security.txt
    location /.well-known/security.txt {
        return 200 "Contact: mailto:security@letterbookxd.com\nExpires: 2025-12-31T23:59:59.000Z\nPreferred-Languages: en, pt\nCanonical: https://letterbookxd.com/.well-known/security.txt\nPolicy: https://letterbookxd.com/security-policy\n";
        add_header Content-Type text/plain;
    }
}
