user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
    accept_mutex on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format with security fields
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'csrf="$http_x_csrf_token" req_id="$http_x_request_id"';

    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'blocked=$blocked_country';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=proxy:10m rate=120r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstreams
    upstream web {
        server web:3000;
        keepalive 32;
    }

    upstream api {
        server api-gateway:8080;
        keepalive 32;
    }

    # Security headers template
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # HSTS (only on HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ============================================
    # MAIN SERVER (HTTP -> HTTPS redirect in prod)
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost letterbookxd.com app.letterbookxd.com;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Rate limiting
        limit_req zone=global burst=500 nodelay;
        limit_conn conn_limit 10;

        # Security: block common attacks
        if ($request_uri ~* "(\.git|\.env|\.sql|wp-admin|wp-login|\.php$)") {
            return 404;
        }

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # API Gateway
        location /api/ {
            # Rate limiting per endpoint type
            location ~* ^/api/auth/(login|register|refresh) {
                limit_req zone=auth burst=5 nodelay;
                proxy_pass http://api;
                include proxy_params;
            }

            location ~* ^/api/search {
                limit_req zone=search burst=10 nodelay;
                proxy_pass http://api;
                include proxy_params;
            }

            location ~* ^/api/manga/proxy {
                limit_req zone=proxy burst=20 nodelay;
                proxy_pass http://api;
                include proxy_params;
            }

            location ~* ^/api/health {
                limit_req zone=global burst=100 nodelay;
                proxy_pass http://api;
                include proxy_params;
            }

            location /api/ {
                limit_req zone=api burst=50 nodelay;
                proxy_pass http://api;
                include proxy_params;
            }
        }

        # Health checks (no rate limit for monitoring)
        location /health {
            proxy_pass http://api/health;
            include proxy_params;
            limit_req zone=global burst=100 nodelay;
        }

        # Swagger docs
        location /docs {
            proxy_pass http://api/docs;
            include proxy_params;
            limit_req zone=api burst=20 nodelay;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri @web;
        }

        location @web {
            proxy_pass http://web;
            include proxy_params;
        }
    }

    # ============================================
    # HTTPS SERVER (Production)
    # ============================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name letterbookxd.com app.letterbookxd.com;

    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;

    #     # OCSP Stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 1.1.1.1 1.0.0.1 valid=300s;
    #     resolver_timeout 5s;

    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    #     # Same proxy config as HTTP server above
    #     # ...
    # }

    # Proxy params include
    # Include this in each location or use include proxy_params;
}

# ============================================
# PROXY PARAMS (include in locations)
# ============================================
# Create this as /etc/nginx/conf.d/proxy_params.conf
