apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherRegex: "trace[_-]?id[=: ]*([a-f0-9]{32})"
          url: "http://tempo:3200/traces/${__value.raw}"
        - name: spanId
          matcherRegex: "span[_-]?id[=: ]*([a-f0-9]{16})"
          url: "http://tempo:3200/traces/${__value.raw}"
